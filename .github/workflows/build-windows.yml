name: Build Windows CUDA Release

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Release version tag label for archive naming'
        required: false
        default: 'v2.3.1-krista-1.5.9.0'
        type: string

jobs:
  build-win64-cuda:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NVIDIA CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cuobjdump"]'

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Restore vcpkg binary cache
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-win2022-${{ hashFiles('vcpkg.json') }}

      - name: Ensure Ninja and vcpkg toolchain are ready
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vsNinja = Join-Path $env:DevEnvDir "CommonExtensions\Microsoft\CMake\Ninja"
            if (Test-Path (Join-Path $vsNinja "ninja.exe")) {
              $vsNinja | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$vsNinja;$env:PATH"
            } else {
              choco install ninja -y
            }
          }
          ninja --version
          cl 2>&1 | Select-Object -First 2
          $global:LASTEXITCODE = 0
          nvcc --version

          $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          if (-not $vcpkgRoot -or -not (Test-Path "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
            throw "vcpkg toolchain not found (VCPKG_ROOT=$env:VCPKG_ROOT, VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT)"
          }
          "VCPKG_DIR=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake (Ninja + vcpkg manifest + CUDA)
        id: configure
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Save vcpkg binary cache
        if: steps.configure.outcome == 'success' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-win2022-${{ hashFiles('vcpkg.json') }}

      - name: Build ccminer (Release x64)
        shell: pwsh
        run: |
          cmake --build build --parallel -- -k 0

      - name: Stage package, collect DLLs, and run smoke checks
        shell: pwsh
        run: |
          $ver = "${{ inputs.package_version }}"
          if (-not $ver) { $ver = "v2.3.1-krista-1.5.9.0" }
          $pkgName = "ccminer-$ver-win64-cuda12.8"
          $stageDir = Join-Path (Resolve-Path ".").Path "dist\$pkgName"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $exePath = "build\ccminer.exe"
          if (-not (Test-Path $exePath)) {
            throw "Missing built binary: $exePath"
          }
          $exeDest = Join-Path $stageDir "ccminer.exe"
          Copy-Item $exePath -Destination $exeDest -Force

          Get-ChildItem "build\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $stageDir $_.Name) -Force
          }

          $vcpkgBin = "build\vcpkg_installed\x64-windows\bin"
          $queue = [System.Collections.Generic.Queue[string]]::new()
          $visited = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $queue.Enqueue($exeDest)
          $null = $visited.Add($exeDest)
          Get-ChildItem (Join-Path $stageDir "*.dll") -ErrorAction SilentlyContinue | ForEach-Object {
            if ($visited.Add($_.FullName)) {
              $queue.Enqueue($_.FullName)
            }
          }

          while ($queue.Count -gt 0) {
            $cur = $queue.Dequeue()
            $depsOut = & dumpbin /dependents $cur 2>&1 | Out-String
            Write-Host "=== dumpbin /dependents $(Split-Path -Leaf $cur) ==="
            Write-Host $depsOut
            foreach ($line in ($depsOut -split "`r?`n")) {
              if ($line -match '^\s+([A-Za-z0-9._+-]+\.dll)\s*$') {
                $dllName = $matches[1]
                $destDll = Join-Path $stageDir $dllName
                if (-not (Test-Path $destDll) -and (Test-Path $vcpkgBin)) {
                  $cand = Join-Path $vcpkgBin $dllName
                  if (Test-Path $cand) {
                    Copy-Item $cand -Destination $destDll -Force
                  }
                }
                if ((Test-Path $destDll) -and $visited.Add($destDll)) {
                  $queue.Enqueue($destDll)
                }
              }
            }
          }

          Copy-Item "README.txt", "LICENSE.txt" -Destination $stageDir

          Write-Host "=== Staged Files ==="
          Get-ChildItem $stageDir | Format-Table Name, Length -AutoSize

          Write-Host "=== Smoke Test: ccminer.exe --help ==="
          $helpOut = & $exeDest --help 2>&1 | Out-String
          Write-Host $helpOut
          if ($LASTEXITCODE -ne 0) {
            throw "ccminer.exe --help exited with $LASTEXITCODE"
          }
          foreach ($flag in @("--coinbase-addr", "--no-auto-register", "--cputest")) {
            if ($helpOut -notmatch [regex]::Escape($flag)) {
              throw "Missing expected flag in --help output: $flag"
            }
          }

          Write-Host "=== Smoke Test: ccminer.exe --version ==="
          $verOut = & $exeDest --version 2>&1 | Out-String
          Write-Host $verOut
          if ($LASTEXITCODE -ne 0) {
            throw "ccminer.exe --version exited with $LASTEXITCODE"
          }
          if ($verOut -notmatch "libcurl/") {
            throw "Missing libcurl/ info in --version output"
          }

          Write-Host "=== CUDA ELF Targets ==="
          $elfOut = & cuobjdump --list-elf $exeDest | Out-String
          foreach ($sm in @("sm_75", "sm_80", "sm_86", "sm_89", "sm_90", "sm_120")) {
            if ($elfOut -notmatch $sm) {
              throw "Missing CUDA cubin architecture: $sm"
            }
          }
          Write-Host (($elfOut -split "`r?`n" | Select-Object -First 20) -join "`n")

          Write-Host "=== CUDA PTX Targets ==="
          $ptxOut = & cuobjdump --list-ptx $exeDest | Out-String
          if ($ptxOut -notmatch "sm_120|compute_120") {
            throw "Missing CUDA PTX sm_120/compute_120"
          }
          Write-Host (($ptxOut -split "`r?`n" | Select-Object -First 10) -join "`n")

          $zipPath = "dist\$pkgName.zip"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force
          Get-Item $zipPath | Select-Object Name, Length
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows CUDA release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccminer-win64-cuda12.8
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
